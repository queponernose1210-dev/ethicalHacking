{% extends "base.html" %}

{% block title %}Información de Usuario{% endblock %}

{% block content %}
    <h1>Hello {{ namehtml }} your age is {{ agehtml }}</h1>

    {% if agehtml > 18 %}
        <h1>Es mayor de edad</h1>
    {% else %}
        <h1>Es menor de edad</h1>
    {% endif %}
{% endblock %}
